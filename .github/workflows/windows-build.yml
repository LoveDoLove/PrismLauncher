# Windows Build Workflow for PrismLauncher
# Based on GitHub Actions starter workflow conventions

name: Windows Build

on:
  push:
    branches: [ $default-branch ]
  pull_request:
    branches: [ $default-branch ]
  workflow_dispatch:
  workflow_call:
    inputs:
      build_type:
        description: Type of build (Debug, Release, etc)
        type: string
        default: Release
    secrets:
      WINDOWS_CODESIGN_CERT:
        description: Certificate for signing Windows builds
        required: false
      WINDOWS_CODESIGN_PASSWORD:
        description: Password for signing Windows builds
        required: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Windows-MinGW-w64"
            os: windows-2022
            msystem: clang64
            qt_ver: 6
            qt_host: windows
            qt_arch: ""
            qt_version: "6.8.1"
            qt_modules: "qt5compat qtimageformats qtnetworkauth"
            vcvars_arch: "amd64_x86"
    runs-on: ${{ matrix.os }}
    env:
      INSTALL_DIR: install
      INSTALL_PORTABLE_DIR: install-portable
      BUILD_DIR: build
      CCACHE_VAR: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          fetch-tags: true
      - name: Get version from latest remote tag
        id: version
        shell: bash
        run: |
          tag=""
          # Always get the latest remote tag from GitHub API (never use local tag)
          echo "Fetching latest remote tag from GitHub API..."
          tag=$(curl -s "https://api.github.com/repos/PrismLauncher/PrismLauncher/tags" | jq -r '.[0].name' 2>/dev/null || true)
          # If jq fails, try PowerShell (always available on Windows)
          if [[ -z "$tag" || "$tag" == "null" ]]; then
            echo "jq failed, trying PowerShell..."
            tag=$(powershell -Command "
              try {
                \$response = Invoke-RestMethod -Uri 'https://api.github.com/repos/PrismLauncher/PrismLauncher/tags'
                if (\$response -and \$response.Count -gt 0) {
                  \$response[0].name
                }
              } catch {
                Write-Error \$_.Exception.Message
              }
            " 2>/dev/null || true)
          fi
          if [[ -z "$tag" || "$tag" == "null" ]]; then
            echo "ERROR: No remote tag found using any method!" >&2
            exit 1
          fi
          echo "Final version: $tag"
          echo "version=$tag" >> $GITHUB_OUTPUT
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            git
            mingw-w64-x86_64-binutils
          pacboy: >-
            toolchain:p
            cmake:p
            extra-cmake-modules:p
            ninja:p
            qt6-base:p
            qt6-svg:p
            qt6-imageformats:p
            quazip-qt6:p
            ccache:p
            qt6-5compat:p
            qt6-networkauth:p
            cmark:p
      - name: Install Qt
        if: matrix.msystem == ''
        uses: jurplel/install-qt-action@v4
        with:
          aqtversion: "==3.1.*"
          py7zrversion: ">=0.20.2"
          version: ${{ matrix.qt_version }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: ${{ matrix.qt_modules }}
          cache: true
      - name: Configure CMake (MinGW)
        shell: msys2 {0}
        run: |
          cmake -S . -B ${{ env.BUILD_DIR }} -DCMAKE_INSTALL_PREFIX=${{ env.INSTALL_DIR }} -DCMAKE_BUILD_TYPE=Release -DENABLE_LTO=ON -DLauncher_ENABLE_JAVA_DOWNLOADER=ON -DLauncher_BUILD_PLATFORM=official -DCMAKE_C_COMPILER_LAUNCHER=${{ env.CCACHE_VAR }} -DCMAKE_CXX_COMPILER_LAUNCHER=${{ env.CCACHE_VAR }} -DLauncher_QT_VERSION_MAJOR=6 -DCMAKE_OBJDUMP=/mingw64/bin/objdump.exe -DLauncher_BUILD_ARTIFACT=${{ matrix.name }}-Qt${{ matrix.qt_ver }} -G Ninja
      - name: Build (MinGW)
        shell: msys2 {0}
        run: |
          cmake --build ${{ env.BUILD_DIR }}
      - name: Test (MinGW)
        shell: msys2 {0}
        run: |
          ctest -E "^example64|example$" --test-dir build --output-on-failure
      - name: Package (MinGW)
        shell: msys2 {0}
        run: |
          cmake --install ${{ env.BUILD_DIR }}
          touch ${{ env.INSTALL_DIR }}/manifest.txt
          for l in $(find ${{ env.INSTALL_DIR }} -type f); do l=$(cygpath -u $l); l=${l#$(pwd)/}; l=${l#${{ env.INSTALL_DIR }}/}; l=${l#./}; echo $l; done >> ${{ env.INSTALL_DIR }}/manifest.txt
      - name: Upload binary zip
        uses: actions/upload-artifact@v4
        with:
          name: PrismLauncher-${{ matrix.name }}-${{ steps.version.outputs.version }}-Release
          path: ${{ env.INSTALL_DIR }}/**
      - name: Upload binary zip (portable)
        uses: actions/upload-artifact@v4
        with:
          name: PrismLauncher-${{ matrix.name }}-Portable-${{ steps.version.outputs.version }}-Release
          path: ${{ env.INSTALL_PORTABLE_DIR }}/**
